[package]
name = "delta-neutral-router"
version = "0.1.0"
description = "Delta-Neutral Yield Routing Engine via Kamino and Marginfi CPIs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "delta_neutral_router"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
solana-program = "1.18.26"
pyth-sdk-solana = "0.10.1"